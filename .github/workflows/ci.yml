name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.x is whatever scripts/requirements-lock.txt pins. 5.x installs that
          # same lock, then replaces only opencv-python-headless.
          - name: opencv4
            opencv_override: ""
          - name: opencv5
            opencv_override: "opencv-python-headless>=5,<6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-lock.txt
      - name: Override OpenCV for the 5.x leg
        if: matrix.opencv_override != ''
        run: python -m pip install --disable-pip-version-check "${{ matrix.opencv_override }}"
      # Once per workflow, not once per OpenCV version.
      - name: Secret scan
        if: matrix.name == 'opencv4'
        run: |
          bash scripts/secret-scan.sh
          bash tests/secret-scan.test.sh
      - run: python -m pytest tests/smoke -q
